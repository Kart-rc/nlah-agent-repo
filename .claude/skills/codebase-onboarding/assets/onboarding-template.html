<!DOCTYPE html>
<!--
  codebase-onboarding HTML skeleton.
  SELF-CONTAINMENT CONTRACT: this file must render fully from file:// with
  no network. No <script src>, no <link href>, no remote images, no
  webfonts. Diagrams are inline SVG (or <pre> ASCII fallbacks). Outbound
  <a href> links to external sites are permitted; fetched resources are not.
  Placeholders filled by the skill: {{TITLE}} {{GENERATED_DATE}} {{NAV}} {{SECTIONS}}
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Onboarding</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5a5f66; --accent: #0b5fa5;
    --panel: #f5f6f8; --border: #d8dce1; --code-bg: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e6e8eb; --muted: #9aa1a9; --accent: #6db3e8;
      --panel: #1d2026; --border: #333941; --code-bg: #21252c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; min-height: 100vh;
  }
  nav {
    position: sticky; top: 0; align-self: flex-start; height: 100vh;
    overflow-y: auto; width: 240px; flex-shrink: 0; padding: 1.25rem 1rem;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  nav h1 { font-size: 1rem; margin: 0 0 .25rem; }
  nav .meta { font-size: .75rem; color: var(--muted); margin-bottom: 1rem; }
  nav input {
    width: 100%; padding: .35rem .5rem; margin-bottom: .75rem;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: .85rem;
  }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin: .15rem 0; }
  nav a { color: var(--fg); text-decoration: none; display: block;
          padding: .2rem .4rem; border-radius: 5px; font-size: .9rem; }
  nav a:hover, nav a.active { background: var(--border); color: var(--accent); }
  main { flex: 1; min-width: 0; padding: 2rem 3rem 4rem; max-width: 60rem; }
  section { margin-bottom: 3rem; }
  section > h2 {
    cursor: pointer; border-bottom: 2px solid var(--border);
    padding-bottom: .3rem; margin-top: 0;
  }
  section > h2::after { content: " ▾"; color: var(--muted); font-size: .8em; }
  section.collapsed > h2::after { content: " ▸"; }
  section.collapsed > *:not(h2) { display: none; }
  h2, h3, h4 { line-height: 1.3; }
  a { color: var(--accent); }
  code, pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .875em; background: var(--code-bg); border-radius: 5px;
  }
  code { padding: .1em .35em; }
  pre { padding: .8rem 1rem; overflow-x: auto; border: 1px solid var(--border); }
  pre code { padding: 0; background: none; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .92em; }
  th, td { border: 1px solid var(--border); padding: .4rem .6rem; text-align: left; }
  th { background: var(--panel); }
  blockquote { margin: 1rem 0; padding: .5rem 1rem; border-left: 3px solid var(--accent);
               background: var(--panel); color: var(--muted); }
  svg { max-width: 100%; height: auto; }
  .tier { font-size: .75em; padding: .1em .45em; border-radius: 9px;
          border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .unknown { color: var(--accent); font-weight: 600; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    nav { position: static; width: 100%; height: auto; border-right: none;
          border-bottom: 1px solid var(--border); }
    main { padding: 1.25rem; }
  }
  @media print {
    nav { display: none; }
    main { max-width: none; padding: 0; }
    section.collapsed > *:not(h2) { display: block; }
  }
</style>
</head>
<body>
<nav>
  <h1>{{TITLE}}</h1>
  <div class="meta">Onboarding guide · generated {{GENERATED_DATE}}</div>
  <input id="filter" type="search" placeholder="Filter sections…" aria-label="Filter sections">
  <ul id="nav-list">
{{NAV}}
  </ul>
</nav>
<main id="content">
{{SECTIONS}}
</main>
<script>
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('#nav-list a'));
    var sections = Array.prototype.slice.call(document.querySelectorAll('main > section'));
    document.querySelectorAll('main > section > h2').forEach(function (h) {
      h.addEventListener('click', function () {
        h.parentElement.classList.toggle('collapsed');
      });
    });
    var filter = document.getElementById('filter');
    filter.addEventListener('input', function () {
      var q = filter.value.toLowerCase();
      links.forEach(function (a) {
        a.parentElement.style.display =
          a.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
      });
    });
    function highlight() {
      var pos = window.scrollY + 100, current = null;
      sections.forEach(function (s) { if (s.offsetTop <= pos) current = s.id; });
      links.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + current);
      });
    }
    window.addEventListener('scroll', highlight);
    highlight();
  })();
</script>
</body>
</html>
